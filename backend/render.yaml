services:
  - type: web
    name: growth-gradual-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GROQ_API_KEYS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOGO_B64
        sync: false
      - key: GG_PDF_RENDER_ENGINE
        value: chromium
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: growth-gradual-screener-daily
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python jobs/update_screener_daily.py --mode daily --from-db
    schedule: "30 6 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SCREENER_UPDATE_WORKERS
        value: "2"
